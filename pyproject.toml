[project]
name = "mcp-server-python-starter"
version = "0.1.0"
description = "Production-ready MCP server in Python, with stdio and Streamable HTTP, OAuth, and tool tests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "opikdev" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "starter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.16,<3",
  "mcp>=2.3,<3",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "pyjwt[crypto]>=2.15,<3",
  "starlette>=1.10,<2",
  "tzdata>=2025.2",
  "uvicorn>=0.54,<1",
]

[project.scripts]
mcp-server-python-starter = "mcp_app.cli:main"

[project.urls]
Homepage = "https://github.com/opikdev/mcp-server-python-starter"
Issues = "https://github.com/opikdev/mcp-server-python-starter/issues"

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PL", "TRY", "PERF", "T20"]
# The formatter wraps code. Long strings, such as a renamed project name, may exceed the limit.
ignore = ["E501", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607", "PLR0913", "PLR0917"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-markers"
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mcp_app"]
branch = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
